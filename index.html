<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Glowing Particle Heart</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #00040a; /* Nền đen pha xanh dương rất tối */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        /* Dòng chữ hướng dẫn nhỏ ở góc màn hình */
        #hint {
            position: absolute;
            bottom: 20px;
            color: rgba(0, 242, 254, 0.5); /* Đổi sang màu xanh */
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>
    <div id="hint">Di chuột qua trái tim để tương tác</div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY, baseScale;

        // Bảng màu xanh dương neon cho trái tim 3D
        const colors = [
            '#00f2fe', 
            '#4facfe', 
            '#00aaff', 
            '#00ffff', 
            '#80d4ff',
            '#b3e6ff'
        ];

        // Hàm tính toán kích thước canvas
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            baseScale = Math.min(width, height) * 0.22; // Tỉ lệ cho thể tích 3D
        }

        window.addEventListener('resize', resize);
        resize();

        // Tọa độ chuột
        const mouse = { x: -1000, y: -1000, radius: 150 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseout', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });
        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        window.addEventListener('touchend', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        // Lớp đối tượng Hạt (Particle 3D)
        class Particle {
            constructor() {
                let x, y, z;
                // Thuật toán Rejection Sampling: Tìm các điểm nằm BÊN TRONG thể tích trái tim 3D
                // Phương trình: (x^2 + 2.25y^2 + z^2 - 1)^3 - x^2*z^3 - 0.1125*y^2*z^3 <= 0
                while (true) {
                    x = (Math.random() - 0.5) * 3; // Trục X ngang
                    y = (Math.random() - 0.5) * 3; // Trục Y chiều sâu
                    z = (Math.random() - 0.5) * 3; // Trục Z dọc
                    
                    let a = x*x + 2.25*y*y + z*z - 1;
                    let val = a*a*a - x*x*z*z*z - 0.1125*y*y*z*z*z;
                    if (val <= 0) {
                        this.baseX = x;
                        this.baseY = y; 
                        this.baseZ = z;
                        break;
                    }
                }
                
                // Vị trí khởi tạo 3D (Bắt đầu phân tán rộng)
                this.x = (Math.random() - 0.5) * width;
                this.y = (Math.random() - 0.5) * height;
                this.z = (Math.random() - 0.5) * 1000;
                
                // Vận tốc 3D
                this.vx = 0;
                this.vy = 0;
                this.vz = 0;
                
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.size = Math.random() * 1.8 + 0.5; 
            }

            update(beatScale) {
                const time = Date.now() * 0.0006;
                const rotAngle = time; // Góc xoay tự động quanh trục Y (trục dọc)

                // Tính toán tọa độ 3D sau khi xoay (Rotated Base Coordinates)
                const rx = this.baseX * Math.cos(rotAngle) - this.baseY * Math.sin(rotAngle);
                const rDepth = this.baseX * Math.sin(rotAngle) + this.baseY * Math.cos(rotAngle);
                const rVert = this.baseZ;

                // Áp dụng scale và nhịp đập
                const scale = baseScale * beatScale; 
                const targetX = rx * scale;
                const targetY = -rVert * scale; // Âm rVert vì màn hình Canvas Y hướng xuống dưới
                const targetZ = rDepth * scale;

                // Tương tác chuột (đẩy hạt trong không gian dựa trên chiếu 2D tạm thời)
                const fov = 800;
                const tempProjScale = fov / (fov + this.z);
                const screenX = centerX + this.x * tempProjScale;
                const screenY = centerY + this.y * tempProjScale;

                const dxMouse = screenX - mouse.x;
                const dyMouse = screenY - mouse.y;
                const distanceToMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                
                if (distanceToMouse < mouse.radius) {
                    const force = (mouse.radius - distanceToMouse) / mouse.radius;
                    // Đẩy ra theo không gian 3D
                    this.vx += (dxMouse / distanceToMouse) * force * 5;
                    this.vy += (dyMouse / distanceToMouse) * force * 5;
                    this.vz += (Math.random() - 0.5) * force * 15; // Phân tán chiều sâu
                }

                // Vật lý lò xo 3D: Kéo hạt về hình thái trái tim
                this.vx += (targetX - this.x) * 0.035;
                this.vy += (targetY - this.y) * 0.035;
                this.vz += (targetZ - this.z) * 0.035;

                // Ma sát
                this.vx *= 0.83; 
                this.vy *= 0.83;
                this.vz *= 0.83;

                // Cập nhật vị trí
                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;
            }

            draw() {
                // Chiếu phối cảnh (Perspective Projection)
                const fov = 800;
                const zDepth = fov + this.z;
                
                // Ẩn các hạt nằm quá xa sau camera
                if (zDepth <= 0) return; 

                const projScale = fov / zDepth;
                const projX = centerX + this.x * projScale;
                const projY = centerY + this.y * projScale;
                
                const r = this.size * projScale;
                if (r < 0.1) return;

                // Tính toán độ mờ: Càng xa (z lớn) càng mờ để tạo cảm giác chiều sâu 3D
                const opacity = Math.min(1, Math.max(0.05, 1 - (this.z / 350)));

                ctx.beginPath();
                ctx.arc(projX, projY, r, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = opacity;
                ctx.fill();
                
                // Khôi phục Alpha để không ảnh hưởng frame làm mờ
                ctx.globalAlpha = 1.0;
            }
        }

        // Tạo quần thể 5000 hạt lấp đầy thể tích 3D
        const particles = [];
        const particleCount = 5000;
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Tính nhịp đập
        function getBeatScale() {
            const time = Date.now() / 1000;
            const phase = (time * 1.3) % (Math.PI * 2); 
            if (phase < 0.3) {
                return 1 + 0.12 * Math.sin(phase * Math.PI / 0.3);
            } else if (phase > 0.5 && phase < 0.8) {
                return 1 + 0.06 * Math.sin((phase - 0.5) * Math.PI / 0.3);
            }
            return 1;
        }

        // Vòng lặp hoạt ảnh
        function animate() {
            // Xóa mờ bằng nền đen pha xanh tối
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 4, 10, 0.25)'; 
            ctx.fillRect(0, 0, width, height);

            // Chế độ trộn màu Lighter tạo sự phát sáng khi các khối hạt 3D xếp chồng
            ctx.globalCompositeOperation = 'lighter';

            const beatScale = getBeatScale();

            for (let i = 0; i < particles.length; i++) {
                particles[i].update(beatScale);
                particles[i].draw();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
