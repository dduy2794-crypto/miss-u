<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Blue Particle Heart</title>
    <style>
        /* Đặt lại lề và đảm bảo khung nền đen chiếm toàn bộ màn hình */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Nền đen */
            overflow: hidden;       /* Ẩn thanh cuộn */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas chiếm toàn bộ màn hình */
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let baseScale = 1; // Tỷ lệ thu phóng của trái tim dựa trên màn hình

        // Hàm thay đổi kích thước canvas cho vừa màn hình
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            // Tính toán tỷ lệ cơ bản sao cho trái tim vừa với màn hình nhỏ nhất
            baseScale = Math.min(width, height) / 45; 
        }

        window.addEventListener('resize', resize);
        resize();

        // Mảng màu xanh neon để tạo hiệu ứng
        const colors = [
            'rgba(0, 191, 255, 1)',   // DeepSkyBlue
            'rgba(0, 255, 255, 1)',   // Cyan
            'rgba(30, 144, 255, 1)',  // DodgerBlue
            'rgba(135, 206, 250, 1)'  // LightSkyBlue
        ];

        // Hàm toán học vẽ hình trái tim
        // Tham số t: góc (từ 0 đến 2PI)
        function getHeartPoint(t) {
            // Công thức chuẩn của đường cong trái tim
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        // Lớp Hạt cấu tạo nên trái tim
        class HeartParticle {
            constructor() {
                this.reset();
                // Khi mới bắt đầu, hạt xuất hiện ngẫu nhiên khắp màn hình để bay vào
                this.x = Math.random() * width;
                this.y = Math.random() * height;
            }

            reset() {
                // Vị trí ngẫu nhiên trên đường cong trái tim (góc t)
                this.t = Math.random() * Math.PI * 2;
                
                // Độ phân tán: để trái tim không chỉ là đường viền mà có cả hạt bên trong
                // Dùng căn bậc hai để các hạt tập trung nhiều ở viền hơn
                this.scatter = Math.sqrt(Math.random()) * 0.8 + 0.2; 
                
                this.size = Math.random() * 1.5 + 0.5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                // Vận tốc
                this.vx = 0;
                this.vy = 0;
            }

            update(beatScale) {
                // 1. Tính toán vị trí đích của hạt trên hình trái tim tại thời điểm hiện tại
                const point = getHeartPoint(this.t);
                
                // Áp dụng độ phân tán, tỷ lệ màn hình và nhịp đập
                let targetX = centerX + point.x * baseScale * beatScale * this.scatter;
                let targetY = centerY + point.y * baseScale * beatScale * this.scatter;

                // Thêm chút nhiễu động (noise) để trái tim trông tự nhiên và rung động
                targetX += (Math.random() - 0.5) * 3;
                targetY += (Math.random() - 0.5) * 3;

                // 2. Di chuyển hạt về vị trí đích (Hiệu ứng lò xo / Spring easing)
                const dx = targetX - this.x;
                const dy = targetY - this.y;

                // Cập nhật vận tốc
                this.vx += dx * 0.03;
                this.vy += dy * 0.03;

                // Lực cản để hạt không dao động quá mạnh
                this.vx *= 0.85;
                this.vy *= 0.85;

                // Cập nhật vị trí
                this.x += this.vx;
                this.y += this.vy;

                // Tỉ lệ sinh ra các hạt văng ra (sparks) phụ thuộc vào nhịp đập
                if (Math.random() < 0.01 * beatScale) {
                    sparks.push(new SparkParticle(this.x, this.y, this.color));
                }
            }

            draw() {
                // Vẽ hạt sáng rõ ở giữa
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Vẽ quầng sáng (glow) mờ hơn xung quanh hạt
                ctx.fillStyle = this.color.replace('1)', '0.2)'); // Giảm alpha xuống 0.2
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Lớp Hạt tia lửa văng ra khi trái tim đập
        class SparkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 1.5;
                
                // Bắn ra theo hướng ngẫu nhiên
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.life = 1; // Thời gian sống
                this.decay = Math.random() * 0.02 + 0.01; // Tốc độ mờ dần
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw() {
                if (this.life <= 0) return;
                
                // Đặt độ trong suốt theo thời gian sống còn lại
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.globalAlpha = 1; // Đặt lại alpha cho các hình vẽ khác
            }
        }

        // Khởi tạo các mảng chứa hạt
        const particles = [];
        const sparks = [];
        const particleCount = 1500; // Số lượng hạt, tăng lên nếu muốn đặc hơn

        for (let i = 0; i < particleCount; i++) {
            particles.push(new HeartParticle());
        }

        // Vòng lặp hoạt ảnh
        function animate() {
            // Tạo hiệu ứng đuôi mờ (trail) bằng cách phủ một lớp bán trong suốt
            // thay vì xóa sạch toàn bộ màn hình
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, width, height);

            // Bật chế độ trộn màu 'lighter' để các hạt màu xanh chồng lên nhau phát sáng chói hơn (neon effect)
            ctx.globalCompositeOperation = 'lighter';

            // Tính toán nhịp tim (Heartbeat logic)
            // Nhịp tim thật thường có 2 nhịp đập nhanh (lub-dub) rồi nghỉ
            const time = Date.now() / 1000;
            let beatScale = 1;
            const phase = (time * 1.2) % (Math.PI * 2); // Tốc độ nhịp tim

            if (phase < 0.4) {
                // Nhịp 1
                beatScale = 1 + 0.15 * Math.sin(phase * Math.PI / 0.4);
            } else if (phase > 0.6 && phase < 1.0) {
                // Nhịp 2
                beatScale = 1 + 0.08 * Math.sin((phase - 0.6) * Math.PI / 0.4);
            }

            // Cập nhật và vẽ các hạt chính của trái tim
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(beatScale);
                particles[i].draw();
            }

            // Cập nhật và vẽ các tia lửa (sparks) văng ra, xóa đi nếu đã hết "đời sống"
            for (let i = sparks.length - 1; i >= 0; i--) {
                sparks[i].update();
                sparks[i].draw();
                if (sparks[i].life <= 0) {
                    sparks.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Bắt đầu hoạt ảnh
        animate();

    </script>
</body>
</html>
